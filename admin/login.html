<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Interior Duct Ltd</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #1B3A6B 0%, #2A5298 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 380px;
      padding: 3rem 2rem;
      text-align: center;
    }

    .login-header {
      margin-bottom: 2rem;
    }

    .login-header h1 {
      font-size: 1.8rem;
      color: #1B3A6B;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .login-header p {
      color: #666;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-group {
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: #1B3A6B;
      box-shadow: 0 0 0 3px rgba(27, 58, 107, 0.1);
    }

    .default-creds {
      background: #E8F1FE;
      border: 1px solid #B3D9FF;
      border-radius: 6px;
      padding: 0.8rem;
      margin: 1rem 0;
      font-size: 0.85rem;
      color: #0052CC;
      line-height: 1.5;
    }

    .default-creds strong {
      display: block;
      margin-bottom: 0.3rem;
      color: #003580;
    }

    .default-creds code {
      background: rgba(0, 82, 204, 0.1);
      padding: 0.2rem 0.4rem;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
    }

    .login-btn {
      background: linear-gradient(135deg, #1B3A6B 0%, #2A5298 100%);
      color: white;
      border: none;
      padding: 0.85rem;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(27, 58, 107, 0.3);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .error-message {
      background: #FEE;
      color: #C33;
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
      border-left: 4px solid #C33;
    }

    .success-message {
      background: #EFE;
      color: #3C3;
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
      border-left: 4px solid #3C3;
    }

    .login-footer {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #eee;
      font-size: 0.8rem;
      color: #999;
    }

    .security-note {
      background: #FFF8E1;
      border-left: 4px solid #FFC107;
      padding: 0.75rem;
      margin: 1rem 0;
      font-size: 0.85rem;
      color: #856404;
      border-radius: 4px;
    }

    .security-note strong {
      display: block;
      margin-bottom: 0.3rem;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 2rem 1.5rem;
      }

      .login-header h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>🔐 Admin Panel</h1>
      <p>Interior Duct Ltd — Management Console</p>
    </div>

    <div class="error-message" id="errorMsg"></div>
    <div class="success-message" id="successMsg"></div>

    <form class="login-form" id="loginForm">
      <div class="default-creds">
        <strong>📌 Default Credentials:</strong>
        Username: <code>admin</code><br>
        Password: <code>admin</code>
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          placeholder="Enter username"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Enter password"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" class="login-btn">Login</button>

      <div class="security-note">
        <strong>⚠️ Security Reminder:</strong>
        Change your password immediately after first login for security.
      </div>
    </form>

    <div class="login-footer">
      <p>© 2026 Interior Duct Ltd. All rights reserved.</p>
    </div>
  </div>

  <script>
    const DEFAULT_ADMIN_USER = 'admin';
    const DEFAULT_ADMIN_PASS = 'admin';

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      
      // Hide previous messages
      document.getElementById('errorMsg').style.display = 'none';
      document.getElementById('successMsg').style.display = 'none';

      // Validate credentials
      if (username === DEFAULT_ADMIN_USER && password === DEFAULT_ADMIN_PASS) {
        // Check if user has set a custom password
        const customHash = localStorage.getItem('adminPasswordHash');
        
        // For first login or if using default credentials
        if (!customHash) {
          // First login - show success and redirect
          document.getElementById('successMsg').textContent = '✅ Login successful! Redirecting...';
          document.getElementById('successMsg').style.display = 'block';
          
          // Store session
          sessionStorage.setItem('adminLoggedIn', 'true');
          sessionStorage.setItem('adminUser', username);
          sessionStorage.setItem('loginTime', new Date().toISOString());
          
          setTimeout(() => {
            window.location.href = '/admin/index.html';
          }, 1000);
        } else {
          // Default credentials used but custom password is set
          document.getElementById('errorMsg').textContent = '❌ Invalid credentials. Please use your custom password.';
          document.getElementById('errorMsg').style.display = 'block';
        }
      } else {
        // Check against custom password hash if it exists
        const storedHash = localStorage.getItem('adminPasswordHash');
        if (storedHash) {
          const inputHash = btoa(`${username}:${password}`);
          if (inputHash === storedHash) {
            document.getElementById('successMsg').textContent = '✅ Login successful! Redirecting...';
            document.getElementById('successMsg').style.display = 'block';
            
            sessionStorage.setItem('adminLoggedIn', 'true');
            sessionStorage.setItem('adminUser', username);
            sessionStorage.setItem('loginTime', new Date().toISOString());
            
            setTimeout(() => {
              window.location.href = '/admin/index.html';
            }, 1000);
            return;
          }
        }
        
        // Invalid credentials
        document.getElementById('errorMsg').textContent = '❌ Invalid username or password.';
        document.getElementById('errorMsg').style.display = 'block';
        document.getElementById('password').value = '';
      }
    });

    // Check if already logged in
    if (sessionStorage.getItem('adminLoggedIn') === 'true') {
      window.location.href = '/admin/index.html';
    }
  </script>
</body>
</html>
